const el = (id) => document.getElementById(id);

async function init() {
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    window.location.href = "index.html";
    return;
  }

  const email = data.session.user.email;

  if (email === "monte.eng@gmail.com" || email === "eem.dragao.mar@gmail.com") {
    isAdmin = true;
    el("infoUser").innerText = "Admin: " + email;
    el("infoComp").innerText = "Modo administrativo";
    el("componenteSelect").style.display = "block";
  } else {
    const { data: prof } = await sb
      .from("professores")
      .select("nome, componente")
      .eq("email", email)
      .maybeSingle();

    if (prof) {
      nomeProfessor = prof.nome || "";
      componenteProfessor = prof.componente || "";
      el("infoUser").innerText = "Professor: " + nomeProfessor;
      el("infoComp").innerText = "Componente: " + componenteProfessor;
    }
  }

  montarDatas();
  montarTurmas();
  bindEvents();
}

function montarDatas() {
  const hoje = new Date();
  let html = `<option value="">Selecione a data...</option>`;
  for (let i = 0; i < 15; i++) {
    const d = new Date(hoje);
    d.setDate(hoje.getDate() - i);
    const iso = d.toISOString().slice(0, 10);
    html += `<option value="${iso}">${iso}</option>`;
  }
  el("data").innerHTML = html;
}

function montarTurmas() {
  const mod = el("modalidade").value;
  const turma = el("turma");
  turma.innerHTML = `<option value="">Selecione a turma...</option>`;
  if (!mod || !dadosEscola[mod]) return;
  Object.keys(dadosEscola[mod]).forEach(t => {
    turma.innerHTML += `<option value="${t}">${t}</option>`;
  });
  el("tabela").innerHTML = "";
}

async function carregar() {
  const mod = el("modalidade").value;
  const tur = el("turma").value;
  const dataSel = el("data").value;
  const comp = isAdmin ? el("componenteSelect").value : componenteProfessor;

  if (!mod || !tur || !dataSel || !comp) return;

  const { data: registros, error } = await sb
    .from("frequencia_nova")
    .select("aluno, presente")
    .eq("turma", tur)
    .eq("data", dataSel)
    .eq("componente", comp);

  if (error) {
    alert("Erro ao carregar frequência: " + error.message);
    return;
  }

  let html = "<tr><th>Aluno</th><th>Presente</th></tr>";
  (dadosEscola[mod][tur] || []).forEach((aluno, i) => {
    const reg = (registros || []).find(r => r.aluno === aluno);
    const checked = reg && reg.presente ? "checked" : "";
    html += `
      <tr>
        <td class="nome">${aluno}</td>
        <td><input type="checkbox" id="p${i}" ${checked}></td>
      </tr>`;
  });

  el("tabela").innerHTML = html;
}

async function salvar() {
  const mod = el("modalidade").value;
  const tur = el("turma").value;
  const dataSel = el("data").value;
  const comp = isAdmin ? el("componenteSelect").value : componenteProfessor;

  if (!mod || !tur || !dataSel || !comp) {
    alert("Selecione modalidade, turma, componente e data.");
    return;
  }

  const linhas = el("tabela").querySelectorAll("tr");
  const { data: userData } = await sb.auth.getUser();

  const dados = [];
  linhas.forEach((linha, i) => {
    if (i === 0) return;
    const aluno = linha.children[0].innerText;
    const presente = linha.children[1].querySelector("input").checked;

    dados.push({
      professor_email: userData.user.email,
      professor_nome: nomeProfessor || "Administrador",
      componente: comp,
      turma: tur,
      data: dataSel,
      aluno: aluno,
      presente: presente,
      status: presente ? "Presença" : "Falta"
    });
  });

  const { error } = await sb
    .from("frequencia_nova")
    .upsert(dados, { onConflict: "componente,turma,data,aluno" });

  if (error) {
    alert("Erro ao salvar: " + error.message);
    return;
  }

  alert("Frequência salva com sucesso!");
  carregar();
}

function bindEvents() {
  el("modalidade").addEventListener("change", montarTurmas);
  el("turma").addEventListener("change", carregar);
  el("data").addEventListener("change", carregar);
  el("componenteSelect").addEventListener("change", carregar);
  el("btnSalvar").addEventListener("click", salvar);
  el("btnVoltar").addEventListener("click", () => window.location.href = "painel.html");
}

init();
</script>
