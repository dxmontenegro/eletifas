async function init() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = 'index.html'; return; }

  const email = data.session.user.email;
  if (email === 'monte.eng@gmail.com' || email === 'eem.dragao.mar@gmail.com') {
    isAdmin = true;
    el('infoUser').innerText = 'Admin: ' + email;
    el('infoComp').innerText = 'Modo administrativo';
    el('componenteSelect').style.display = 'block';
  } else {
    const { data: prof } = await sb.from('professores').select('nome, componente').eq('email', email).maybeSingle();
    if (prof) {
      nomeProfessor = prof.nome || '';
      componenteProfessor = prof.componente || '';
      el('infoUser').innerText = 'Professor: ' + nomeProfessor;
      el('infoComp').innerText = 'Componente: ' + componenteProfessor;
    }
  }

  bindEvents();
}

function montarTurmas() {
  const mod = el('modalidade').value;
  const turma = el('turma');
  turma.innerHTML = `<option value="">Selecione a turma...</option>`;
  if (!mod || !dadosEscola[mod]) return;
  Object.keys(dadosEscola[mod]).forEach(t => turma.innerHTML += `<option value="${t}">${t}</option>`);
  el('tabela').innerHTML = '';
  el('resumo').innerHTML = 'Selecione modalidade, turma e mês para visualizar o relatório.';
}

function carregar() {
  const mod = el('modalidade').value;
  const tur = el('turma').value;
  const mes = el('mes').value;
  const comp = isAdmin ? el('componenteSelect').value : componenteProfessor;
  const resumo = el('resumo');
  const tabela = el('tabela');

  if (!mod || !tur || !mes || !comp) { tabela.innerHTML = ''; return; }
  const mesNome = monthNames[mes] || mes;
  fetchFaltas(tur, mes, mesNome, comp, mod, resumo, tabela);
}

async function fetchFaltas(tur, mes, mesNome, comp, mod, resumo, tabela) {
  try {
    let query = sb.from('frequencia_nova')
      .select('aluno, presente, componente, turma, data, status')
      .eq('turma', tur)
      .eq('componente', comp);

    const { data, error } = await query;
    if (error) {
      console.error(error);
      resumo.innerHTML = `Erro ao carregar dados: <strong>${error.message}</strong>`;
      tabela.innerHTML = '';
      return;
    }

    const registrosMes = (data || []).filter(r => {
      if (!r.data) return false;
      const m = String(r.data).slice(5, 7);
      return m === mes;
    });

    const porAluno = {};
    registrosMes.forEach(r => {
      if (!porAluno[r.aluno]) porAluno[r.aluno] = 0;
      const falta = (r.presente === false) || (String(r.status || '').toLowerCase() === 'falta');
      if (falta) porAluno[r.aluno] += 1;
    });

    const alunos = dadosEscola[mod]?.[tur] || [];
    let html = '<tr><th>Aluno</th><th class="falta">Faltas</th></tr>';
    let somaTurma = 0;
    let qtdAlunosComFalta = 0;

    alunos.forEach(aluno => {
      const faltas = porAluno[aluno];
      const tem = Number.isFinite(faltas);
      if (tem) { somaTurma += faltas; if (faltas > 0) qtdAlunosComFalta++; }
      html += `<tr><td class="nome">${aluno}</td><td class="falta">${tem ? `<span class="ok">${faltas}</span>` : '<span class="vazio">-</span>'}</td></tr>`;
    });

    tabela.innerHTML = html;
    resumo.innerHTML = `Turma <strong>${tur}</strong> | Componente <strong>${comp.replace('Aperfeiçoamento em ', '')}</strong> | Mês <strong>${mesNome}</strong>. Total de faltas lançadas: <strong>${somaTurma}</strong> | Alunos com faltas: <strong>${qtdAlunosComFalta}</strong>.`;
  } catch (err) {
    console.error(err);
    resumo.innerHTML = `Erro inesperado: <strong>${err.message}</strong>`;
    tabela.innerHTML = '';
  }
}

function getTabelaDados() {
  const table = el('tabela');
  return [...table.querySelectorAll('tr')].map(tr => [...tr.querySelectorAll('th,td')].map(td => td.innerText.trim()));
}

function gerarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  const mod = el('modalidade').value || '';
  const tur = el('turma').value || '';
  const mes = el('mes').value || '';
  const comp = isAdmin ? el('componenteSelect').value || '' : componenteProfessor || '';
  const mesNome = monthNames[mes] || mes;

  doc.setFontSize(14);
  doc.text('Relatório de Faltas - EEMTI DRAGÃO DO MAR', 14, 15);
  doc.setFontSize(10);
  doc.text(`Modalidade: ${mod} | Turma: ${tur} | Componente: ${comp} | Mês: ${mesNome}`, 14, 22);

  const rows = getTabelaDados();
  doc.autoTable({
    head: [rows[0] || []],
    body: rows.slice(1),
    startY: 28,
    styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
    headStyles: { fillColor: [0, 77, 64] },
    theme: 'grid',
    margin: { left: 10, right: 10 }
  });

  doc.save(`faltas_${tur || 'turma'}_${mes || 'mes'}.pdf`);
}

function gerarXLS() {
  const table = el('tabela');
  const wb = XLSX.utils.table_to_book(table, { sheet: 'Relatorio' });
  XLSX.writeFile(wb, `faltas_${el('turma').value || 'turma'}_${el('mes').value || 'mes'}.xlsx`);
}

function bindEvents() {
  el('modalidade').addEventListener('change', () => { montarTurmas(); carregar(); });
  el('turma').addEventListener('change', carregar);
  el('mes').addEventListener('change', carregar);
  if (el('componenteSelect')) el('componenteSelect').addEventListener('change', carregar);
  el('btnPDF').addEventListener('click', gerarPDF);
  el('btnXLS').addEventListener('click', gerarXLS);
  el('btnVoltar').addEventListener('click', () => window.location.href = 'painel.html');
}

init();
</script>
</body>
</html>
